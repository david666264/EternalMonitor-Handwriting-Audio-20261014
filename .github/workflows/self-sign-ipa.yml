name: Self-sign IPA

on:
  workflow_dispatch:
    inputs:
      microphone_only:
        description: Run unit and USB/audio regression without repeating unchanged keyboard UI suites
        type: boolean
        default: false
      reuse_audio_from_run:
        description: Reuse successful audio UI checks only when product and UI sources are identical
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: self-sign-ipa-${{ github.ref }}-${{ inputs.reuse_audio_from_run || 'full' }}
  cancel-in-progress: false

jobs:
  device-ipa:
    name: Unsigned iPad device IPA
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate IPA packaging checks
        run: python3 -m unittest discover -s scripts -p test_package_unsigned_ipa.py
      - name: Build iOS device archive without signing
        run: |
          export BUILD=$((1000 + GITHUB_RUN_NUMBER))
          bash scripts/testflight-local.sh --dry-run
      - name: Package and verify the self-sign IPA
        run: |
          python3 scripts/package_unsigned_ipa.py \
            --archive build/testflight/EternalMonitor.xcarchive \
            --output build/self-sign/EternalMonitor-v0.3.0-chinese-input-unsigned.ipa
          cp LICENSE build/self-sign/LICENSE
      - name: Retain the IPA
        uses: actions/upload-artifact@v4
        with:
          name: EternalMonitor-chinese-input-unsigned-IPA
          path: build/self-sign/
          if-no-files-found: error
          retention-days: 14
      - name: Retain device build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-evidence
          path: |
            build/testflight/archive.log
            build/testflight/result.json
          if-no-files-found: ignore
          retention-days: 7

  chinese-input-tests:
    name: Chinese UI and native keyboard
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator build dependencies
        run: |
          brew install xcodegen ffmpeg@7 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: drawing-audio-tests
      - name: Create the test iPad
        id: sim
        run: |
          UDID=$(xcrun simctl create chinese-input \
            com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB \
            com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test Chinese UI, marked text, draft editing and remote input
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
          EM_UI_EVIDENCE_DIR: ${{ github.workspace }}/build/e2e/chinese-input
          EM_TEST_STAMP: chinese-input
          EM_MICROPHONE_ONLY: ${{ inputs.microphone_only }}
        run: |
          if [[ "$EM_MICROPHONE_ONLY" == "true" ]]; then
            bash scripts/test_ios.sh -only-testing:EternalMonitorTests
          else
            bash scripts/test_ios.sh \
              -only-testing:EternalMonitorTests \
              -only-testing:EternalMonitorUITests/ConnectScreenTests \
              -only-testing:EternalMonitorUITests/KeyboardRelayTests \
              -only-testing:EternalMonitorUITests/ChineseInputTests
          fi
      - name: Retain keyboard and UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-input-test-evidence
          path: |
            build/e2e/chinese-input/
            build/ios-ui-host-chinese-input.log
            build/ios-ui-input-chinese-input.trace
          if-no-files-found: error
          retention-days: 7

  drawing-audio-tests:
    name: Drawing mode audio on Wi-Fi and USB
    if: ${{ inputs.reuse_audio_from_run == '' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator build dependencies
        run: |
          brew install xcodegen ffmpeg@7 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Create the test iPad
        id: sim
        run: |
          UDID=$(xcrun simctl create handwriting-audio \
            com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB \
            com.apple.CoreSimulator.SimRuntime.iOS-18-6)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test live audio negotiation, mute and USB transport
        env:
          EM_SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: bash scripts/e2e_stream_ui.sh
      - name: Retain audio test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-audio-test-evidence
          path: build/e2e/stream-ui/
          if-no-files-found: ignore
          retention-days: 7

  verify-audio-baseline:
    name: Verify identical audio UI baseline
    if: ${{ inputs.reuse_audio_from_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check successful audio job and identical product sources
        env:
          AUDIO_BASELINE_RUN: ${{ inputs.reuse_audio_from_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.request

          run_id = os.environ['AUDIO_BASELINE_RUN']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('The baseline run must be a decimal run ID')
          repository = os.environ['GITHUB_REPOSITORY']
          root = f'https://api.github.com/repos/{repository}/actions/runs/{run_id}'

          def read_api(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'EternalMonitor-audio-baseline-check',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          baseline = read_api(root)
          sha = baseline.get('head_sha', '')
          if not re.fullmatch(r'[0-9a-fA-F]{40}', sha):
              raise SystemExit('The baseline commit must be a 40-character hexadecimal SHA')
          deadline = time.monotonic() + 20 * 60
          previous = None
          while True:
              jobs = read_api(root + '/jobs?filter=latest&per_page=100')['jobs']
              matches = [job for job in jobs if job['name'] == 'Drawing mode audio on Wi-Fi and USB']
              if len(matches) != 1:
                  raise SystemExit('The baseline must contain exactly one audio UI job')
              job = matches[0]
              current = (job['status'], job['conclusion'])
              if current != previous:
                  print(f'Baseline audio UI job: {current[0]} / {current[1]}', flush=True)
                  previous = current
              if job['status'] == 'completed':
                  if job['conclusion'] != 'success':
                      raise SystemExit('The baseline audio UI job did not succeed')
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('The baseline audio UI job did not finish within twenty minutes')
              time.sleep(min(30, max(0, deadline - time.monotonic())))

          subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', sha],
                         check=True, timeout=90)
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '-z', sha, 'HEAD'], text=True).split('\0')
          allowed = {'.github/workflows/self-sign-ipa.yml',
                     'ios/EternalMonitorTests/AudioPlaybackTests.swift'}
          unexpected = [name for name in changed if name and name not in allowed]
          if unexpected:
              raise SystemExit('Audio UI baseline reuse rejected; other sources changed: '
                               + ', '.join(unexpected))
          print(f'PASS: audio UI baseline run {run_id}, commit {sha}; '
                'product, UI test and dependency sources are identical')
          PY
